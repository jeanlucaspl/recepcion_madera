<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recepción · Madera Labrada</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ─── Header ─────────────────────────────────────────────────────────── -->
<header>
  <h1>🌿 Madera Labrada</h1>
  <div id="month-nav">
    <button id="btn-prev" class="btn-icon" title="Mes anterior">◀</button>
    <span id="month-label">—</span>
    <button id="btn-next" class="btn-icon" title="Mes siguiente">▶</button>
    <button id="btn-new-month" class="btn-primary" title="Crear nuevo mes">+ Mes</button>
    <button id="btn-del-month" class="btn-danger" title="Eliminar mes actual">Eliminar mes</button>
  </div>
</header>

<!-- ─── Tabs ────────────────────────────────────────────────────────────── -->
<div class="tabs">
  <button class="tab-btn active" data-tab="disponibilidad">Disponibilidad</button>
  <button class="tab-btn" data-tab="buscar">Buscar habitación</button>
</div>

<!-- ─── Vista: Disponibilidad ────────────────────────────────────────────── -->
<div id="view-disponibilidad" class="view">

  <div class="filters">
    <div class="filter-group">
      <label for="f-nombre">Habitación</label>
      <input type="text" id="f-nombre" placeholder="Nombre..." style="width:130px;">
    </div>
    <div class="filter-group">
      <label for="f-tipo">Tipo</label>
      <select id="f-tipo">
        <option value="">Todos</option>
        <option value="S">Simple</option>
        <option value="M">Matrimonial</option>
        <option value="D">Doble</option>
        <option value="T">Triple</option>
        <option value="C">Cuádruple</option>
        <option value="Q">Quíntuple</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Camas</label>
      <div class="camas-range">
        <select id="f-camas-min" onchange="autoMaxCamas()">
          <option value="">Mín</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
        <span class="range-sep">–</span>
        <select id="f-camas-max">
          <option value="">Máx</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>
    </div>
    <div class="filter-group">
      <label for="f-bloque">Bloque</label>
      <select id="f-bloque">
        <option value="">Todos</option>
        <option value="1">Bloque 1</option>
        <option value="2">Bloque 2</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="f-aire">Aire acond.</label>
      <select id="f-aire">
        <option value="">Todos</option>
        <option value="si">Con aire</option>
        <option value="no">Sin aire</option>
      </select>
    </div>
    <button id="btn-clear-filters" class="btn-secondary" style="background:var(--wood-light);color:#fff;align-self:flex-end;">
      Limpiar filtros
    </button>
  </div>

  <div class="actions-bar">
    <button class="btn-wood" onclick="openMultiModal()">+ Reserva general</button>
  </div>

  <div id="room-list"></div>
</div>

<!-- ─── Vista: Buscar ────────────────────────────────────────────────────── -->
<div id="view-buscar" class="view hidden">

  <div class="search-form">
    <div class="filter-group">
      <label for="s-checkin">Día de entrada</label>
      <input type="number" id="s-checkin" min="1" max="31" placeholder="ej. 15">
    </div>
    <div class="filter-group">
      <label for="s-checkout">Día de salida</label>
      <input type="number" id="s-checkout" min="1" max="32" placeholder="ej. 17">
    </div>
    <div class="filter-group">
      <label for="s-tipo">Tipo</label>
      <select id="s-tipo">
        <option value="">Cualquiera</option>
        <option value="S">Simple</option>
        <option value="M">Matrimonial</option>
        <option value="D">Doble</option>
        <option value="T">Triple</option>
        <option value="C">Cuádruple</option>
        <option value="Q">Quíntuple</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Camas</label>
      <div class="camas-range">
        <select id="s-camas-min">
          <option value="">Mín</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
        <span class="range-sep">–</span>
        <select id="s-camas-max">
          <option value="">Máx</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>
    </div>
    <button id="btn-search" class="btn-primary" style="align-self:flex-end;">Buscar</button>
  </div>

  <div id="search-results"></div>
</div>

<!-- ─── Overlay ───────────────────────────────────────────────────────────── -->
<div id="modal-overlay" class="hidden"></div>

<!-- ─── Modal: Reservas de habitación ────────────────────────────────────── -->
<div id="modal" class="hidden">
  <div class="modal-header">
    <h2 id="modal-title">—</h2>
    <button class="btn-close-modal" onclick="closeModal()">✕</button>
  </div>
  <p class="modal-subtitle" id="modal-subtitle"></p>

  <p class="modal-section-title">Disponibilidad actual</p>
  <div id="modal-ranges"></div>

  <p class="modal-section-title">Reservas registradas</p>
  <div id="modal-bookings"></div>

  <p class="modal-section-title">Agregar reserva</p>
  <div class="booking-form">
    <div class="form-row">
      <div class="form-field">
        <label for="f-checkin">Día entrada</label>
        <input type="number" id="f-checkin" min="1" max="31" placeholder="ej. 15">
      </div>
      <div class="form-field">
        <label for="f-checkout">Día salida</label>
        <input type="number" id="f-checkout" min="2" max="32" placeholder="ej. 17">
      </div>
    </div>
    <div class="form-field">
      <label for="f-huesped">Huésped (opcional)</label>
      <input type="text" id="f-huesped" placeholder="Nombre o referencia">
    </div>
    <button class="btn-primary" onclick="submitBooking()">Confirmar reserva</button>
  </div>
</div>

<!-- ─── Modal: Nuevo mes ──────────────────────────────────────────────────── -->
<div id="modal-new-month" class="hidden">
  <div class="modal-header">
    <h2>Nuevo mes</h2>
    <button class="btn-close-modal" onclick="closeNewMonthModal()">✕</button>
  </div>
  <p style="font-size:13px;color:var(--gray);margin-top:6px;">
    Todas las habitaciones comenzarán disponibles el mes 1 hasta el último día.
  </p>
  <div class="new-month-form">
    <div class="form-field">
      <label for="nm-year">Año</label>
      <input type="number" id="nm-year" min="2026" max="2030" value="2026">
    </div>
    <div class="form-field">
      <label for="nm-month">Mes (1–12)</label>
      <input type="number" id="nm-month" min="1" max="12" value="9">
    </div>
    <button class="btn-primary" onclick="submitNewMonth()">Crear mes</button>
  </div>
</div>

<!-- ─── Modal: Reserva general ──────────────────────────────────────────── -->
<div id="modal-multi" class="hidden">
  <div class="modal-header">
    <h2>Reserva general</h2>
    <button class="btn-close-modal" onclick="closeMultiModal()">✕</button>
  </div>
  <p class="modal-subtitle">Busca y agrega habitaciones, luego asigna fechas a cada una.</p>

  <div class="multi-search-wrap">
    <input type="text" id="multi-search" placeholder="Buscar habitación por nombre..." autocomplete="off" oninput="renderMultiSuggestions()">
    <div id="multi-suggestions" class="multi-suggestions hidden"></div>
  </div>

  <div id="multi-list"></div>

  <button class="btn-primary" style="margin-top:14px;width:100%;" onclick="submitMultiBooking()">Confirmar reserva general</button>
</div>

<!-- ─── Scripts ───────────────────────────────────────────────────────────── -->
<script src="js/rooms.js"></script>
<script src="js/ranges.js"></script>
<script src="js/storage.js"></script>
<script src="js/seed.js"></script>
<script src="js/app.js"></script>
</body>
</html>
